<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Body -->
  <ellipse cx="100" cy="150" rx="55" ry="50" fill="#FF9A3C"/>
  <!-- Head -->
  <circle cx="100" cy="85" r="45" fill="#FF9A3C"/>
  <!-- Left ear -->
  <polygon points="60,50 45,15 80,40" fill="#FF9A3C"/>
  <polygon points="62,48 50,22 76,42" fill="#FFB6C1"/>
  <!-- Right ear -->
  <polygon points="140,50 155,15 120,40" fill="#FF9A3C"/>
  <polygon points="138,48 150,22 124,42" fill="#FFB6C1"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="80" rx="10" ry="12" fill="#2C3E50"/>
  <ellipse cx="118" cy="80" rx="10" ry="12" fill="#2C3E50"/>
  <circle cx="85" cy="77" r="3" fill="white"/>
  <circle cx="121" cy="77" r="3" fill="white"/>
  <!-- Nose -->
  <polygon points="100,95 95,102 105,102" fill="#FF6B9D"/>
  <!-- Mouth -->
  <path d="M95,102 Q100,110 105,102" stroke="#2C3E50" stroke-width="2" fill="none"/>
  <!-- Whiskers left -->
  <line x1="55" y1="97" x2="90" y2="100" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="55" y1="103" x2="90" y2="103" stroke="#2C3E50" stroke-width="1.5"/>
  <!-- Whiskers right -->
  <line x1="145" y1="97" x2="110" y2="100" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="145" y1="103" x2="110" y2="103" stroke="#2C3E50" stroke-width="1.5"/>
  <!-- Belly -->
  <ellipse cx="100" cy="158" rx="30" ry="28" fill="#FFDAB9"/>
  <!-- Left arm -->
  <ellipse cx="48" cy="150" rx="14" ry="28" fill="#FF9A3C" transform="rotate(-20,48,150)"/>
  <!-- Right arm -->
  <ellipse cx="152" cy="150" rx="14" ry="28" fill="#FF9A3C" transform="rotate(20,152,150)"/>
  <!-- Left leg -->
  <ellipse cx="76" cy="196" rx="16" ry="20" fill="#FF9A3C"/>
  <!-- Right leg -->
  <ellipse cx="124" cy="196" rx="16" ry="20" fill="#FF9A3C"/>
  <!-- Tail -->
  <path d="M155,170 Q195,150 185,120 Q175,95 160,110" stroke="#FF9A3C" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="72" cy="96" rx="10" ry="7" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="128" cy="96" rx="10" ry="7" fill="#FFB6C1" opacity="0.6"/>
</svg>
